name: performance-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dist/server.js > server.log 2>&1 &
      - run: |
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/api/health && break
            sleep 1
          done
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: performance/k6/smoke.js
