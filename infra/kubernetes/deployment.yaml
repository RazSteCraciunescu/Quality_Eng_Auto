apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-readiness-lab
  namespace: quality-lab
  labels:
    app.kubernetes.io/name: release-readiness-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: release-readiness-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-readiness-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: release-readiness-lab:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4173
          envFrom:
            - configMapRef:
                name: release-readiness-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
