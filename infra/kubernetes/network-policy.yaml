apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-readiness-ingress
  namespace: quality-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: release-readiness-lab
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 4173
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
